<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#121018" />
  <title>Galeria de Desenhos 🖤💜</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="wallpaper-overlay" aria-hidden="true"></div>

  <!-- TELA 1: BLOQUEIO POR CÓDIGO SECRETO -->
  <main id="lock-screen" class="lock-screen">
    <div class="lock-card">
      <div class="gif-slot gif-slot--lock" id="gif-slot-lock">
        <span class="gif-placeholder" aria-hidden="true">💀💜</span>
      </div>

      <h1 class="lock-title">Cantinho dos Desenhos</h1>
      <p class="lock-subtitle">Digite o código secreto para abrir o mural</p>

      <form id="lock-form" class="lock-form" autocomplete="off">
        <input
          type="password"
          id="secret-code-input"
          class="input-kuromi input-kuromi--center"
          placeholder="Código secreto..."
          aria-label="Código secreto"
          required
        />
        <button type="submit" class="btn-kuromi btn-kuromi--primary">
          Destrancar Mural 🔓
        </button>
      </form>
      <p id="lock-error" class="lock-error" role="alert" aria-live="polite"></p>
    </div>
  </main>

  <!-- TELA 2: GALERIA PRINCIPAL -->
  <div id="gallery-app" class="gallery-app hidden">
    <header class="app-header">
      <div class="header-brand">
        <div class="gif-slot gif-slot--header" id="gif-slot-header">
          <span class="gif-placeholder" aria-hidden="true">🖤</span>
        </div>
        <div>
          <h1 class="app-title">Meus Desenhos</h1>
          <p class="app-subtitle">Mural artístico &amp; rascunhos</p>
        </div>
      </div>

      <div class="header-actions">
        <button id="btn-open-add" class="btn-kuromi btn-kuromi--primary">
          + Novo Desenho
        </button>
        <button id="btn-lock-app" class="btn-kuromi btn-kuromi--ghost btn-kuromi--icon" title="Trancar mural" aria-label="Trancar mural">
          🔒
        </button>
      </div>
    </header>

    <section class="toolbar" aria-label="Filtros da galeria">
      <div class="filter-pills" role="tablist">
        <button class="pill active" data-filter="all">Todos (<span id="count-all">0</span>)</button>
        <button class="pill" data-filter="favorites">💜 Favoritos (<span id="count-fav">0</span>)</button>
      </div>

      <input
        type="search"
        id="search-input"
        class="input-kuromi input-kuromi--search"
        placeholder="Buscar por recado ou data..."
        aria-label="Buscar por recado ou data"
      />
    </section>

    <main class="gallery-container">
      <div id="polaroid-grid" class="polaroid-grid"></div>
      <div id="empty-state" class="empty-state hidden">
        <p>Nenhum desenho encontrado por aqui ainda 💜</p>
      </div>
    </main>

    <div class="gif-slot gif-slot--corner" id="gif-slot-corner" aria-hidden="true"></div>
  </div>

  <!-- MODAL 1: ADICIONAR / EDITAR DESENHO -->
  <div id="form-modal" class="modal modal--sheet hidden" role="dialog" aria-modal="true" aria-labelledby="form-modal-title">
    <div class="modal-backdrop" data-close-modal="form-modal"></div>
    <div class="modal-box">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="modal-header">
        <h2 id="form-modal-title">Adicionar Novo Desenho</h2>
        <button class="btn-close" data-close-modal="form-modal" aria-label="Fechar modal">&times;</button>
      </div>

      <form id="art-form" class="art-form">
        <input type="hidden" id="art-id" />

        <div class="form-group" id="image-upload-group">
          <label for="art-file" class="file-dropzone" id="file-dropzone">
            <input type="file" id="art-file" accept="image/*" hidden />
            <img id="image-preview" class="image-preview hidden" alt="Pré-visualização do desenho" />
            <div id="dropzone-prompt" class="dropzone-prompt">
              <span class="dropzone-icon" aria-hidden="true">🖼️</span>
              <span>Toque para escolher ou tirar foto do desenho</span>
            </div>
          </label>
        </div>

        <div class="form-group">
          <label for="art-note">Título ou recado sobre o desenho</label>
          <textarea
            id="art-note"
            class="input-kuromi"
            rows="2"
            maxlength="140"
            placeholder="Ex: Rascunho feito de madrugada..."
            required
          ></textarea>
        </div>

        <div class="form-group">
          <label for="art-date">Data do desenho</label>
          <input type="date" id="art-date" class="input-kuromi" required />
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-kuromi btn-kuromi--ghost" data-close-modal="form-modal">
            Cancelar
          </button>
          <button type="submit" class="btn-kuromi btn-kuromi--primary">
            Salvar no Mural 💜
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL 2: LIGHTBOX -->
  <div id="lightbox-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Visualização ampliada">
    <div class="modal-backdrop" data-close-modal="lightbox-modal"></div>
    <div class="lightbox-content">
      <button class="btn-close btn-close--lightbox" data-close-modal="lightbox-modal" aria-label="Fechar visualização">&times;</button>
      <div class="lightbox-polaroid">
        <img id="lightbox-img" src="" alt="Desenho ampliado" />
        <div class="lightbox-caption">
          <span id="lightbox-date" class="polaroid-date"></span>
          <p id="lightbox-note" class="polaroid-note"></p>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
